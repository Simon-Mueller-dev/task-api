name: Release Workflow

on:
  push:
    tags:
      - 'v*' # Triggers on tags like v1.1.0, v2.0.0, etc.

permissions:
  contents: write # Required to create the release and upload assets

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Build with Maven
        run: mvn -B clean package # Build the WAR file

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          files: target/*.war # Automatically finds and uploads the WAR file
          generate_release_notes: true # Automatically generates a changelog based on commits